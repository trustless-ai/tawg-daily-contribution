name: Deploy TAWG Modal dev app

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/modal-deploy-dev.yml
      - config/privacy.yml
      - deploy/**
      - pyproject.toml
      - requirements-modal-deploy.in
      - requirements-modal-deploy.lock
      - src/**

permissions:
  contents: read

concurrency:
  group: tawg-modal-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    environment: tawg-development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out deployment source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked out revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            printf '%s\n' "Checked out revision does not match the dispatched revision" >&2
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps .

      - name: Install pinned Modal deployment dependencies
        run: python -m pip install --require-hashes -r requirements-modal-deploy.lock

      - name: Verify code and canonical knowledge before deployment
        run: |
          python -m ruff check src tests deploy
          python -m mypy src/tawg_bot
          python -m pytest -q
          python -m tawg_bot.cli vault-lint

      - name: Deploy verified Modal dev app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TAWG_MODAL_APP_NAME: tawg-development
          TAWG_MODAL_BRANCH: dev
          TAWG_REPOSITORY_PERSIST_MODE: receipt-only
          TAWG_DEV_MODE: "true"
        run: modal deploy deploy/modal_app.py
