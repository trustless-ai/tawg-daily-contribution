clear_runtime_credentials() {
            unset GITHUB_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          }
          trap clear_runtime_credentials EXIT
          git_credential="x-access-token:$GITHUB_TOKEN"
          git_authorization="$(printf '%s' "$git_credential" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT="1"
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_authorization"
          unset git_credential git_authorization

          case "$manual_operation" in
            "Run normally — process due work and send")
              selected_mode="$authoritative_mode"
              case "$selected_mode" in
                poll)
                  operation=(tick)
                  ;;
                webhook)
                  operation=(maintenance-tick)
                  ;;
                observe)
                  operation=(tick --observe-only)
                  ;;
              esac
              ;;
            "Preview latest Daily — generate only, do not send")
              current_hour="$(date -u +%H)"
              if (( 10#$current_hour < 23 )); then
                window_end="$(date -u -d 'yesterday 23:00' +%Y-%m-%dT%H:%M:%SZ)"
              else
                window_end="$(date -u -d 'today 23:00' +%Y-%m-%dT%H:%M:%SZ)"
              fi
              python -m tawg_bot.cli daily-dry-run --window-end "$window_end"
              exit 0
              ;;
            "Check only — inspect without Telegram delivery")
              selected_mode="observe"
              if [[ "$authoritative_mode" == "webhook" ]]; then
                operation=(maintenance-tick --observe-only)
              else
                operation=(tick --observe-only)
              fi
              ;;
            "Poll now — process backlog and due Daily, then send")
              if [[ "$authoritative_mode" == "webhook" ]]; then
                echo "Manual backlog polling is disabled while the authoritative runtime mode is webhook" >&2
                exit 2
              fi
              selected_mode="poll"
              operation=(tick)
              ;;
            *)
              echo "Unknown manual operation: $manual_operation" >&2
              exit 2
              ;;
          esac

          case "$selected_mode" in
              poll)
                ;;
              webhook)
                ;;
              observe)
                ;;
              *)
                echo "Selected runtime mode must be poll, webhook, or observe" >&2
                exit 2
                ;;
          esac

          if [[ "$TAWG_DELIVERY_ENABLED" != "true" && "$selected_mode" != "observe" ]]; then
            operation+=(--observe-only)
          fi

          python -m tawg_bot.cli "${operation[@]}"