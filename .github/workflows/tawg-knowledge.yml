name: TAWG knowledge bot

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Choose an operation; each option states whether it can send
        type: choice
        options:
          - Run normally — process due work and send
          - Preview latest Daily — generate only, do not send
          - Check only — inspect without Telegram delivery
          - Poll now — process backlog and due Daily, then send
        default: Run normally — process due work and send

permissions:
  contents: write

concurrency:
  group: tawg-knowledge-writer
  cancel-in-progress: false

jobs:
  knowledge-bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the single writer branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned Python runtime
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps .

      - name: Install locked Claude runtime
        working-directory: deploy/claude-runtime
        run: npm ci --omit=dev --ignore-scripts

      - name: Verify code and canonical knowledge before operation
        run: |
          python -m ruff check src tests
          python -m mypy src/tawg_bot
          python -m pytest -q
          python -m tawg_bot.cli vault-lint

      - name: Run bot with ordered repository checkpoints
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          TAWG_TELEGRAM_CHAT_ID: ${{ vars.TAWG_TELEGRAM_CHAT_ID }}
          TAWG_TELEGRAM_BOT_USERNAME: ${{ vars.TAWG_TELEGRAM_BOT_USERNAME }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ vars.CLAUDE_CODE_EFFORT_LEVEL }}
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: ${{ vars.CLAUDE_CODE_AUTO_COMPACT_WINDOW }}
          TAWG_DELIVERY_ENABLED: ${{ vars.TAWG_DELIVERY_ENABLED }}
          TAWG_RUNTIME_MODE: ${{ vars.TAWG_RUNTIME_MODE }}
          MANUAL_OPERATION: ${{ inputs.operation || 'Run normally — process due work and send' }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/deploy/claude-runtime/node_modules/.bin:$PATH"
          authoritative_mode="${TAWG_RUNTIME_MODE:-poll}"
          manual_operation="$MANUAL_OPERATION"

          case "$authoritative_mode" in
            poll|webhook|observe) ;;
            *)
              echo "TAWG_RUNTIME_MODE must be poll, webhook, or observe" >&2
              exit 2
              ;;
          esac

          clear_runtime_credentials() {
            unset GITHUB_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          }
          trap clear_runtime_credentials EXIT
          git_credential="x-access-token:$GITHUB_TOKEN"
          git_authorization="$(printf '%s' "$git_credential" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT="1"
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_authorization"
          unset git_credential git_authorization

          case "$manual_operation" in
            "Run normally — process due work and send")
              selected_mode="$authoritative_mode"
              case "$selected_mode" in
                poll)
                  operation=(tick)
                  ;;
                webhook)
                  operation=(maintenance-tick)
                  ;;
                observe)
                  operation=(tick --observe-only)
                  ;;
              esac
              ;;
            "Preview latest Daily — generate only, do not send")
              current_hour="$(date -u +%H)"
              if (( 10#$current_hour < 23 )); then
                window_end="$(date -u -d 'yesterday 23:00' +%Y-%m-%dT%H:%M:%SZ)"
              else
                window_end="$(date -u -d 'today 23:00' +%Y-%m-%dT%H:%M:%SZ)"
              fi
              python -m tawg_bot.cli daily-dry-run --window-end "$window_end"
              exit 0
              ;;
            "Check only — inspect without Telegram delivery")
              selected_mode="observe"
              if [[ "$authoritative_mode" == "webhook" ]]; then
                operation=(maintenance-tick --observe-only)
              else
                operation=(tick --observe-only)
              fi
              ;;
            "Poll now — process backlog and due Daily, then send")
              if [[ "$authoritative_mode" == "webhook" ]]; then
                echo "Manual backlog polling is disabled while the authoritative runtime mode is webhook" >&2
                exit 2
              fi
              selected_mode="poll"
              operation=(tick)
              ;;
            *)
              echo "Unknown manual operation: $manual_operation" >&2
              exit 2
              ;;
          esac

          case "$selected_mode" in
              poll)
                ;;
              webhook)
                ;;
              observe)
                ;;
              *)
                echo "Selected runtime mode must be poll, webhook, or observe" >&2
                exit 2
                ;;
          esac

          if [[ "$TAWG_DELIVERY_ENABLED" != "true" && "$selected_mode" != "observe" ]]; then
            operation+=(--observe-only)
          fi

          python -m tawg_bot.cli "${operation[@]}"